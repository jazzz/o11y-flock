# Runs owls in Docker, on any machine that can reach roost. README.md shows
# how; docs/owls.md explains the settings.
#
# Two services:
#   owl    named owls. roost gives each container a name such as barn-01,
#          and the container keeps that name when it restarts or `up`
#          replaces it.
#   owlet  ephemeral owls. roost gives each container a name such as
#          owlet-01, and can give that name to another ephemeral owl two
#          minutes after the container stops.
#
# Compose reads ROOST_URL, FLOCK_KEY and OWL_OPERATOR from deploy/.env or
# from the shell.
#
# `up` downloads the image that CI builds for amd64 and arm64
# (.github/workflows/owl-image.yml). If the download fails, or with
# `up --build`, Compose builds the image here, which takes a long time and a
# lot of disk. Don't push an image built here: it would replace CI's :latest,
# which works on amd64 and arm64, with one for this machine only.
name: flock-owls

x-owl: &owl
  build:
    context: ..
    dockerfile: docker/owl.Dockerfile
    # OWL_REV=$(git rev-parse --short=12 HEAD) docker compose ... up --build
    args: { OWL_REV: "${OWL_REV:-unknown}" }
  image: "${OWL_IMAGE:-ghcr.io/jazzz/flock-owl:latest}"
  restart: unless-stopped
  # Time to stop sending and flush its reports.
  stop_grace_period: 30s
  environment: &env
    ROOST_URL: "${ROOST_URL:?set ROOST_URL in deploy/.env; see README.md}"
    FLOCK_KEY: "${FLOCK_KEY:?set FLOCK_KEY in deploy/.env; see README.md}"
    OWL_OPERATOR: "${OWL_OPERATOR:?set OWL_OPERATOR, your name or handle, in deploy/.env; see README.md}"

services:
  owl:
    <<: *owl
    deploy:
      replicas: ${OWLS:-1}

  owlet:
    <<: *owl
    environment:
      <<: *env
      OWL_EPHEMERAL: "true"
    deploy:
      replicas: ${OWLETS:-0}
