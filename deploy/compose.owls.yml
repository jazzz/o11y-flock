# Runs flock owls in Docker: https://github.com/jazzz/o11y-flock
#
# 1. Download this file as compose.yaml, and the example settings as .env:
#      curl -fsSLo compose.yaml https://raw.githubusercontent.com/jazzz/o11y-flock/main/deploy/compose.owls.yml
#      curl -fsSLo .env https://raw.githubusercontent.com/jazzz/o11y-flock/main/deploy/.env.example
# 2. In .env, fill in roost's address, the flock key and your name, and set
#    how many owls to run. Never commit .env: it holds the flock key.
# 3. In the same directory, run:
#      docker compose up -d
#
# Compose reads .env from the compose file's directory. Until the three
# values are filled in, it refuses to start and names the one missing.

x-settings: &settings
  ROOST_URL: "${ROOST_URL:?set ROOST_URL, roost's address, in .env}"
  FLOCK_KEY: "${FLOCK_KEY:?set FLOCK_KEY, the flock key, in .env}"
  OWL_OPERATOR: "${OWL_OPERATOR:?set OWL_OPERATOR, your name or handle, in .env}"

# Named owls: roost gives each owl container a name such as barn-01, and the
# container keeps that name when it restarts or `up` replaces it.
#
# Ephemeral owls: roost gives each owlet container a name such as owlet-01,
# and can give that name to another ephemeral owl two minutes after the
# container stops.
#
# docs/owls.md in the repository explains the rest.

name: flock-owls

x-owl: &owl
  # The newest owl, which CI builds for amd64 and arm64. Docker downloads it
  # once and keeps that copy. To update the owls to the newest build, run:
  #   docker compose pull && docker compose up -d
  image: ghcr.io/jazzz/flock-owl:latest
  restart: unless-stopped
  # Time to stop sending and flush its reports.
  stop_grace_period: 30s
  environment: *settings

services:
  owl:
    <<: *owl
    deploy:
      # OWLS in .env
      replicas: ${OWLS:-5}

  owlet:
    <<: *owl
    environment:
      <<: *settings
      OWL_EPHEMERAL: "true"
    deploy:
      # None unless started for a while:
      #   docker compose up -d --scale owlet=20 owlet
      replicas: ${OWLETS:-0}
