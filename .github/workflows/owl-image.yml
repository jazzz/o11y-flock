# Builds the owl image for amd64 and arm64, each on a native runner, and
# publishes both as one multi-arch image, ghcr.io/<owner>/flock-owl:
#
#   push to main    :latest, :sha-<12 hex>   (only when the image's inputs change)
#   tag v1.2.3      :1.2.3, :1.2, :sha-<12 hex>
#   manual run      :sha-<12 hex>            (Actions → owl image → Run workflow)
#
# The sha tag matches the OWL_REV each owl reports to roost.
name: owl image

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Not evaluated for tag pushes: a tag always builds.
    paths:
      - "crates/**"
      - Cargo.toml
      - Cargo.lock
      - docker/**
      - .dockerignore
      - .github/workflows/owl-image.yml
  workflow_dispatch:

# A newer push to the same ref cancels a build still running.
concurrency:
  group: owl-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/flock-owl

jobs:
  build:
    name: build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux/amd64, runner: ubuntu-24.04 }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      # libchat's Nix dev shell is an ~8.5 GB layer; the runner's preinstalled
      # SDKs leave too little disk for it.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h /

      - uses: actions/checkout@v7

      - name: Platform and revision
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
          echo "OWL_REV=${GITHUB_SHA::12}" >> "$GITHUB_ENV"

      # Labels only (source, revision, ...); the merge job does the tags.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed by digest, untagged. The cache is per platform and keeps every
      # stage (mode=max), so the Nix layer is rebuilt only when the libchat rev
      # in Cargo.lock changes.
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/owl.Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: OWL_REV=${{ env.OWL_REV }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,scope=${{ env.PLATFORM_PAIR }},mode=max

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_SHORT_SHA_LENGTH: 12
          # On the image index, where ghcr reads a multi-arch image's description.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.IMAGE }}
          # :latest follows main only, not release tags.
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Tag the multi-arch image
        working-directory: ${{ runner.temp }}/digests
        run: |
          mapfile -t tags < <(jq -r '.tags[] | "--tag=" + .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          mapfile -t annotations < <(jq -r '.annotations[] | "--annotation=" + .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          refs=()
          for digest in *; do refs+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${tags[@]}" "${annotations[@]}" "${refs[@]}"

      - name: Inspect
        run: docker buildx imagetools inspect "$IMAGE:$DOCKER_METADATA_OUTPUT_VERSION"
