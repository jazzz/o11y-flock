[workspace]
resolver = "3"
members = ["crates/flock-proto", "crates/owl"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
flock-proto = { path = "crates/flock-proto" }

# libchat, pinned to a pushed rev. Bump all three together, and roost's to match.
logos-chat = { git = "https://github.com/logos-messaging/libchat", rev = "c7c0c1ba50566ecbcbef12958ee9795bdb22db09" }
crypto = { git = "https://github.com/logos-messaging/libchat", rev = "c7c0c1ba50566ecbcbef12958ee9795bdb22db09" }
# Only for its `debug-data` feature, which `Client::debug_data` needs: the epoch
# an owl reports. logos-chat re-exports this crate.
logos-generic-chat = { git = "https://github.com/logos-messaging/libchat", rev = "c7c0c1ba50566ecbcbef12958ee9795bdb22db09", features = ["debug-data"] }

anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
crc32fast = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# liblogosdelivery calls back into Rust across FFI; unwinding through it is UB.
[profile.release]
panic = "abort"
